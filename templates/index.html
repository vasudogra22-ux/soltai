<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SOLTAI AI</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

<section class="hero">

<div class="overlay"></div>

<nav>

<h1>SOLTAI</h1>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Services</a></li>
<li><a href="#">AI</a></li>
<li><a href="#">Contact</a></li>
</ul>

</nav>

<div class="hero-content">

<h2>
AI Powered <br>
Future Solutions
</h2>

<p>
Welcome to SOLTAI AI.
Build smart systems with AI technology.
</p>

<button>
Get Started
</button>

</div>

</section>

<section class="contact">

<h2>Contact Us</h2>

<form>

<input
type="text"
placeholder="Your Name">

<input
type="email"
placeholder="Your Email">

<textarea
placeholder="Your Message">
</textarea>

<button type="submit">
Send Message
</button>

</form>

</section>

<footer>

<p>
© 2026 SOLTAI.IN
All Rights Reserved.
</p>

</footer>

<!-- CHAT BUTTON -->

<div
class="chat-btn"
onclick="openChat()">

💬

</div>

<!-- CHAT BOX -->

<div
class="chat-box"
id="chatBox">

<div class="chat-header">
SOLTAI AI
</div>

<div class="chat-body">

<p>
Hello 👋
</p>

<p>
How can I help you?
</p>

</div>

<div class="chat-input">

<input
type="text"
id="messageInput"
placeholder="Ask AI anything...">

<button
onclick="sendMessage()">

Send

</button>

</div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
