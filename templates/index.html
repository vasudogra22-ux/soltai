<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SOLTAI AI</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="overlay"></div>

<!-- NAVBAR -->

<nav>

<div class="logo">
SOLTAI
</div>

<ul>

<li class="active">Home</li>
<li>Services</li>
<li>AI</li>
<li>Contact</li>

</ul>

</nav>


<!-- HERO -->

<section class="hero">

<div class="left">

<div class="badge">
● Next Generation AI Platform
</div>

<h1>
AI Powered <br>
Future Solutions
</h1>

<p>
Welcome to SOLTAI AI.
Build smart systems with AI technology.
</p>

<button class="btn">

Get Started →
</button>

</div>


<!-- CHAT -->

<div class="chat-panel"
id="chatPanel">

<div class="chat-top">

<div class="chat-profile">

<div class="chat-logo">
S
</div>

<div>

<h2>SOLTAI AI</h2>

<span>
● Online
</span>

</div>

</div>

<div class="minus">
—
</div>

</div>


<div class="chat-body"
id="chatBody">

</div>


<div class="chat-input">
    
<input
id="message"
placeholder="Ask SOLTAI AI anything...">

<button onclick="sendMessage()">
➤
</button>

</div>

<div class="powered">
Powered by SOLTAI AI
</div>

</div>

</section>


<!-- FLOATING BUTTON -->

<div class="floating-btn"
onclick="toggleChat()">

S

</div>

<script
src="{{ url_for('static', filename='script.js') }}">
</script>

</body>
</html>
